services:
  calculator:
    image: ${DOCKERHUB_USERNAME}/calculator-api:${IMAGE_TAG}
    environment:
      SERVER_PORT: 8080
    networks:
      - calculator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:stable
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    networks:
      - calculator-network
    restart: unless-stopped

networks:
  calculator-network:
    driver: bridge